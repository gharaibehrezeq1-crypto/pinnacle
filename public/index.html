<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pinnacle</title>
<meta name="description" content="Pinnacle: thin, soft, absorbent wiping cloths. Free delivery across Jordan.">
<meta property="og:title" content="Pinnacle">
<meta property="og:description" content="Thin, soft, absorbent wiping cloths. Free delivery across Jordan.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23F5F1EA%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%233B302A%27/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F1EA;--ink:#3B302A;--line:#CBB89D;--mut:#8A8078;--font:"Manrope","IBM Plex Sans Arabic",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page{animation:fi .7s ease both}
@media(prefers-reduced-motion:reduce){.page{animation:none}}
body{background:var(--bg);color:var(--ink);font:400 14px/1.7 var(--font);-webkit-font-smoothing:antialiased}
html[lang="ar"] body{font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
.page{max-width:460px;margin:0 auto;padding:18px 20px 60px}
@media(min-width:700px){.img{width:100%;margin-left:0;margin-right:0;border-radius:14px}}
body{overflow-x:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px}
.title{position:relative;line-height:0}
.title svg{display:block;width:120px;height:auto;color:var(--ink);overflow:visible}
.title .djo{position:absolute;left:100%;bottom:3%;margin-left:3px;font:300 9px/1 var(--font);letter-spacing:.06em;color:var(--mut)}
html[lang="ar"] .title{margin-right:14px}
.txt{background:none;border:0;padding:4px 0;color:var(--mut);cursor:pointer;font-size:13px}
.img{display:block;width:100vw;max-width:none;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);aspect-ratio:16/9;object-fit:cover}
.img2{margin-top:34px}
.nowb{display:block;margin:10px 0 0;background:none;border:0;padding:0;color:var(--mut);font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.foot svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.foot .ic{display:flex;align-items:center}
h1{margin:22px 0 2px;font:700 15px/1.4 var(--font)}
p{margin:0}
.d{color:var(--mut)}
.cols{display:flex;gap:8px;margin:18px 0 0}
.col{width:26px;height:16px;border:0;padding:0;cursor:pointer;border-radius:3px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(59,48,42,.18)}
.col[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
.packs{margin:22px 0 0;display:grid;gap:12px}
.pk{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:start;border:0;border-radius:999px;padding:16px 26px;cursor:pointer;color:var(--ink);
 background:linear-gradient(180deg,#FBF8F2,#EBE3D5);box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(203,184,157,.6),0 12px 18px -14px rgba(59,48,42,.45);transition:transform .15s,box-shadow .2s}
.pk:active{transform:scale(.99)}
.pk b{font-weight:600}
.pk span{color:var(--mut);font-weight:500}
.pk[aria-pressed="true"]{color:#F5F1EA;background:linear-gradient(180deg,#5B4B41,#3B302A);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.07),0 14px 22px -12px rgba(59,48,42,.6)}
.pk[aria-pressed="true"] span{color:#D9CDBB}
.sm{margin:14px 0 0;color:var(--mut);font-size:13px}
.order{display:inline-block;margin:18px 0 0;border:0;cursor:pointer;color:#F5F1EA;border-radius:999px;padding:14px 38px;font:600 14px var(--font);background:linear-gradient(180deg,#5B4B41,#3B302A);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.07),0 14px 22px -12px rgba(59,48,42,.6);text-decoration:none}
html[lang="ar"] .order{font-family:"IBM Plex Sans Arabic",sans-serif}
.foot{margin-top:34px;display:flex;flex-direction:column;align-items:center;gap:14px;font-size:13px}
.icons{display:flex;gap:22px;align-items:center}
.pols{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.foot a,.foot button{color:var(--mut);text-decoration:none;background:none;border:0;padding:0;cursor:pointer;font-size:13px}
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(59,48,42,.28)}
.sheet[hidden]{display:none}
.sh-in{width:min(520px,100%);max-height:92dvh;min-height:40dvh;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 6px}
.sh-h b{font-weight:700;font-size:15px}
.sh-x{background:none;border:0;font-size:22px;cursor:pointer;line-height:1}
.sh-t{display:flex;gap:14px;overflow-x:auto;padding:4px 20px 8px;scrollbar-width:none}
.sh-t button{flex:none;background:none;border:0;padding:4px 0;color:var(--mut);cursor:pointer;font-size:13px}
.sh-t button.on{color:var(--ink);border-bottom:1.5px solid var(--ink)}
.sh-b{flex:1;overflow-y:auto;padding:6px 20px 34px}
.sh-b h3{margin:16px 0 2px;font-size:14px}
.sh-b p{color:#5d5048;font-size:13.5px;line-height:1.8;margin:0 0 4px}
.sh-b details{border-bottom:1px solid var(--line)}.sh-b summary{cursor:pointer;padding:14px 0;font-size:15px;color:var(--ink);list-style:none}.sh-b summary::-webkit-details-marker{display:none}.sh-b details p{margin:0 0 14px;color:var(--mut)}.sh-b .dt{margin-top:14px;font-size:12px;color:var(--mut)}
.fld{display:block;margin:14px 0 0;font-size:13px;color:var(--mut)}
.fld input,.fld textarea{display:block;width:100%;margin-top:5px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:400 16px/1.5 var(--font);padding:8px 0;outline:none;border-radius:0}
html[lang="ar"] .fld input,html[lang="ar"] .fld textarea{font-family:"IBM Plex Sans Arabic",sans-serif}
.fld input:focus,.fld textarea:focus{border-color:var(--ink)}
.fld em{display:none;margin-top:4px;font-style:normal;font-size:12px;color:#a8483a}
.fld.bad em{display:block}
.fld.bad input,.fld.bad textarea{border-color:#a8483a}
.note2{margin:12px 0 0;font-size:12.5px;color:var(--mut)}
.linkb{display:block;margin:14px 0 0;background:none;border:0;color:var(--mut);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.sh-b .order{width:100%;margin-top:18px;text-align:center;text-decoration:none}
/* receipt (same print-out as the phone store) */
.rc{margin-top:14px}
.rslot{position:relative;z-index:2;height:12px;border-radius:999px;background:linear-gradient(180deg,#c4c7d4,#e1e3eb);box-shadow:inset 0 2px 3px rgba(70,76,110,.35),0 4px 12px -4px color-mix(in srgb,var(--c) 90%,transparent)}
.rslot::after{content:"";position:absolute;inset:4px 10px auto;height:3px;border-radius:3px;background:#8f93a6}
.rwin{overflow:hidden;margin:-4px 14px 0;padding-top:4px}
.rpaper{position:relative;background:#fff;color:#3a3c48;font:12px/1.55 ui-monospace,'Courier New',monospace;padding:14px 14px 24px;box-shadow:0 8px 18px -10px rgba(70,76,110,.55);transform:translateY(-101%);animation:pcprint 2.8s steps(36,end) forwards;
  -webkit-mask:linear-gradient(#000,#000) top/100% calc(100% - 7px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 7px repeat-x;
  mask:linear-gradient(#000,#000) top/100% calc(100% - 7px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/12px 7px repeat-x}
@keyframes pcprint{to{transform:none}}
.rpaper h4{margin:0;text-align:center;font:700 17px var(--font-latin);letter-spacing:.28em}
.rpaper h4 i{font-style:normal;font-weight:500;font-size:11px;letter-spacing:.05em;color:#888b99}
.rpaper .ct{text-align:center;font-size:11px;color:#6a6d7b}
.rpaper hr{border:0;border-top:1.5px dashed #c3c6d2;margin:8px 0}
.rpaper .rw{display:flex;justify-content:space-between;gap:8px}
.rpaper .rw span:first-child{min-width:0;overflow-wrap:anywhere}
.rpaper .rw span:last-child{white-space:nowrap;direction:ltr}
.rpaper .tt{font-weight:700;font-size:14px}
.rpaper .kv{display:block;overflow-wrap:anywhere}
.rpaper .bar2{height:30px;margin-top:10px;background:repeating-linear-gradient(90deg,#4a4c5a 0 2px,#fff 2px 4px,#4a4c5a 4px 5px,#fff 5px 9px,#4a4c5a 9px 12px,#fff 12px 14px)}
.rpaper .ft{text-align:center;margin-top:8px;font:500 11px var(--font-latin);color:#6a6d7b}
html[lang="ar"] .rpaper .ft{font-family:var(--font-body)}
.rconf{opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .5s,transform .5s;margin-top:6px;text-align:center}
.rconf.in{opacity:1;transform:none;pointer-events:auto}
.rconf p{margin:14px 0 0;font-size:13px;color:#5a5d6b}


.rpaper{color:#3B302A}
</style></head><body>

  function startRoam(svg, rk){
    var ball = svg.querySelector("circle:not([data-roll])"); if(!ball) return;
    var NS = "http://www.w3.org/2000/svg", r = (+ball.getAttribute("r")) * (rk || 1);
    var P = [].slice.call(svg.querySelectorAll("path")).map(function(p){ return p.getBBox(); });
    var polys = [].slice.call(svg.querySelectorAll("polygon"));
    var A = polys.filter(function(p){ return p.getAttribute("points").trim().split(/\s+/).length === 7; })[0].getBBox();
    var topY = A.y, ry = topY - r;
    var spots = [P[0].x+P[0].width*.3, P[1].x+P[1].width*.14, P[1].x+P[1].width*.86, P[2].x+P[2].width*.14, P[2].x+P[2].width*.86, A.x+A.width/2, P[3].x+P[3].width*.55, P[4].x+P[4].width*.12, P[5].x+P[5].width*.5];
    var aIdx = 5;
    var NE = polys.filter(function(q){ return q.getAttribute("points").trim().split(/\s+/).length === 3; });
    var nb = NE.length ? NE[0].getBBox() : null, nxc = nb ? nb.x + nb.width : 0, nlift = nb ? (topY - nb.y) : 0, nw = r*2.9;
    if(nb) spots.push(nxc);
    function bump(px){ if(!nb) return 0; var d = (px - nxc)/nw; return Math.abs(d) < 1 ? Math.pow(Math.cos(d*Math.PI/2), 2)*nlift : 0; }
    ball.style.display = "none";
    var g = document.createElementNS(NS, "g"); g.setAttribute("data-roll", "1");
    var c = document.createElementNS(NS, "circle"); c.setAttribute("r", r); c.setAttribute("fill", "currentColor");
    var h = document.createElementNS(NS, "circle"); h.setAttribute("r", r*.2); h.setAttribute("fill", "#fff"); h.setAttribute("fill-opacity", ".55"); h.setAttribute("cx", r*.55);
    g.appendChild(c); g.appendChild(h); svg.appendChild(g);
    var cur = aIdx, x = spots[cur], ang = 0, from = x, to = x, t0 = 0, dur = 1, rest = 1400, state = "rest", tr = 0;
    function put(y){ g.setAttribute("transform", "translate(" + x + " " + (y - bump(x)) + ")"); h.setAttribute("transform", "rotate(" + (ang*180/Math.PI) + ")"); }
    function ease(k){ return k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3)/2; }
    put(ry);
    if(reduce) return;
    function frame(t){
      if(!svg.isConnected) return;
      if(!t0) t0 = t;
      if(state === "rest"){
        var e = t - t0;
        put(ry - Math.abs(Math.sin(Math.min(1, e/500)*Math.PI*2))*(1 - Math.min(1, e/500))*9);
        if(e > rest){
          var n; do{ n = Math.floor(Math.random()*spots.length); }while(n === cur);
          from = x; to = spots[n]; cur = n; dur = 1200 + Math.abs(to - from)*7.5; state = "roll"; t0 = t; tr = ang;
        }
      } else {
        var k = Math.min(1, (t - t0)/dur), ee = ease(k);
        x = from + (to - from)*ee; ang = tr + (x - from)/r; put(ry);
        if(k >= 1){ state = "rest"; t0 = t; rest = 1900 + Math.random()*2400; }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }
